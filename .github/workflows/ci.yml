# CI:跑离线测试套件(71 项行为测试)。
#
# 设计与仓库哲学一致:
# - 零第三方依赖 → 不需要 npm install,没有缓存步骤
# - 测试完全离线 → 不连 Chrome、不碰微信读书,CI 里永远不会发任何真实请求
# - Node 矩阵 18/20/22 → 验证 package.json 里 engines >= 18 的承诺不是空话
# - Windows 必过:最初是观察腿(从未在 Windows 实测过),首轮 CI 抓到并修掉
#   测试脚手架的 ESM import 路径问题后已稳定全绿,自 v0.2.0 后转为必过项
#
# 安全:本 workflow 的 run 步骤不使用任何来自事件的不可信输入(标题/正文/分支名等),
# 矩阵值均为本文件内的静态字面量;权限收敛为只读。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18', '20', '22']
        include:
          - os: windows-latest
            node: '22'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: 语法检查(所有源码文件)
        shell: bash
        run: |
          for f in bin/*.mjs lib/*.mjs test/*.mjs; do
            node --check "$f"
          done
      - name: 离线测试套件
        run: npm test
